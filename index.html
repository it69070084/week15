<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & To-do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <div class="profile-section">
            <div class="avatar-wrapper">
                <img src="https://pbs.twimg.com/media/HTOIp9wasAM3HD_?format=jpg&name=large" alt="Profile Picture" id="avatar-img">
            </div>
            <h2 class="profile-name">Taz Tupsruri</h2>
            <p class="student-id">student id : 69070084</p>
            <p class="faculty">IT KMITL</p>
      
            <p class="bio">Do Something</p>
            <p class="skills">SKILLS : DO SAME THING</p>

            <a href="https://www.facebook.com/non.t.tsr" target="_blank" class="facebook-link">
                <i class="fa-brands fa-facebook"></i> Facebook
            </a>
        </div>

        <div class="divider"></div>

        <div class="todo-section">
            <h2 class="todo-title">To do List</h2>

        <div class="input-group">
            <input type="text" id="todo-input" placeholder="Enter tasks..." autocomplete="off">
            <button id="add-btn">Add</button>
        </div>

        <ul id="todo-list" class="todo-list">
            <li>
                <span>clean</span>
                <button class="del-btn">del</button>
            </li>
            <li>
                <span>play</span>
                <button class="del-btn">del</button>
            </li>
            <li>
                <span>eat</span>
                <button class="del-btn">del</button>
            </li>
            <li>
                <span>coding</span>
                <button class="del-btn">del</button>
            </li>
        </ul>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
